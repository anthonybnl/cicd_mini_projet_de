name: pipeline
on:
  push:
jobs:
  run_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Set up Python 12
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - name: install requirements
        run: python -m pip install -r requirements.txt
      - name: Setup de la base de donnée et du conteneur S3
        run: docker compose up -d
      - name: On attend que les services soient UP
        run: sleep 5
      - name: Génération du fichier data.csv
        run: python src/generation_data.py
      - name: Lancer le traitement des données
        uses: nick-fields/retry@v3
        with:
          timeout_seconds: 5
          max_attempts: 2
          command: python src/traiter_data.py
      - name: Tests (test des données en BDD)
        run: pytest -vv
    env:
      DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost/mini_projet_de"
