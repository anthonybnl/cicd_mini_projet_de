name: pipeline
on:
  push:
jobs:
  run_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Set up Python 12
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - name: install requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Génération du fichier data.csv
        run: python src/generation_data.py
      - name: Setup de la base de donnée
        run: ./lancer-bdd.sh
      - name: On attend que la BDD soit UP
        run: sleep 5
      - name: Lancer le traitement des données
        run: python src/traiter_data.py
      - name: Tests (test des données en BDD)
        run: pytest -vv
    env:
      DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost/mini_projet_de"