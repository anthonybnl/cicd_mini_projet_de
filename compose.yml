services:
  bdd:
    image: postgres:14.24-trixie
    container_name: bdd
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mini_projet_de
    volumes:
      - ./ddl:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  s3:
    image: rustfs/rustfs:1.0.3
    container_name: s3
    environment:
      RUSTFS_ACCESS_KEY: rustfs
      RUSTFS_SECRET_KEY: rustfs
    ports:
      - "9001:9001"

  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8081:8080"

  # lance l'ETL avec l'OCR (afin de tester dans un environnement linux)
  pipeline:
    build: .
    profiles: ["pipeline"]
    depends_on:
      - bdd
      - s3
    environment:
      DATABASE_URL: "postgresql+psycopg2://postgres:postgres@bdd/mini_projet_de"
      S3_ENDPOINT_URL: "http://s3:9001"
      WITH_OCR: "1"
